services:
  app:
    image: aba-clinico:${ABA_IMAGE_TAG:-local}
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      secrets:
        - next_server_actions_encryption_key
    init: true
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      ABA_TEST_RUN_ID: ${ABA_TEST_RUN_ID:-}
    expose: ["3000"]
    healthcheck:
      test: ["CMD","wget","-q","-O","-","http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "5"
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80","443:443"]
    environment: { APP_HOST: "${APP_HOST}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    logging:
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  caddy_data:
  caddy_config:

secrets:
  next_server_actions_encryption_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
