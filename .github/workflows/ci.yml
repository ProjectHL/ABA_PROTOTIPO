name: CI
on: [push, pull_request]
permissions: { contents: read }

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Synthetic values so Next/Playwright never read a developer .env.local.
      AUTH_SECRET: ci-only-secret-with-at-least-32-bytes
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aba
          POSTGRES_PASSWORD: aba
          POSTGRES_DB: aba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aba -d aba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply bootstrap and all migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://aba:aba@127.0.0.1:5432/aba
      - name: Re-run is a no-op
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://aba:aba@127.0.0.1:5432/aba

  container-build:
    runs-on: ubuntu-latest
    env:
      # Synthetic 32-byte value for CI; never reuse it in a deployment.
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: aba-clinico:ci
          secret-envs: |
            next_server_actions_encryption_key=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
