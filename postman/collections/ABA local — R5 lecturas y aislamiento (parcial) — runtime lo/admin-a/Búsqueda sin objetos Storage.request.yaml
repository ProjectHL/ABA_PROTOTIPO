$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_authorized_search_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_organization_id": "{{qa_clinic_a}}",
      "p_query": "Programa",
      "p_limit": 30
    }
scripts:
  - type: beforeRequest
    code: |-
      const token=pm.variables.get('qa_token_admin_a');
      if(!token) throw new Error('Iniciar sesión sintética admin-a primero');
      pm.variables.set('qa_token',token);
      pm.variables.set('qa_actor_id',pm.variables.get('qa_actor_admin_a'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      const data=pm.response.json();
      pm.test('Solo rutas clínicas',()=>{pm.expect(data).to.be.an('array');data.forEach(row=>{pm.expect(row.path.startsWith('/students/')).to.eql(true);pm.expect(row.path).not.to.match(/storage|https?:/i);});});
    language: text/javascript
order: 11000
