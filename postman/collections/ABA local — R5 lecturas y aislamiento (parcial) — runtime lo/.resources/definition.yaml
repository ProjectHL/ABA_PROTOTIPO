$kind: collection
name: ABA local — R5 lecturas y aislamiento (parcial) — runtime local V5
description: "Colección Postman 2.1 sin secretos. Ejecuta lecturas reales usando exclusivamente el lote sintético ready 2155e99e-bda4-4c68-95cf-b74cacd84ecd. NO acredita QA-001–016 completa: comandos, UI/Server Actions, offline, archivos y recuperación tienen evidencia separada pendiente. Importar variables privadas en entorno local, nunca sincronizar/exportar secretos. Revoca cada sesión al terminar; si se interrumpe, ejecutar logout de los perfiles iniciados. No contiene borrados clínicos ni Storage."
variables:
  qa_api_url: http://127.0.0.1:54321
  qa_public_key: ""
  qa_clinic_a: ""
  qa_clinic_b: ""
  qa_batch_id: 2155e99e-bda4-4c68-95cf-b74cacd84ecd
scripts:
  - type: http:beforeRequest
    code: |-
      if(pm.variables.get('qa_api_url')!=='http://127.0.0.1:54321') throw new Error('Local API required');
      if(!pm.variables.get('qa_runtime_v5_loaded')) {
       const runtime=await pm.sendRequest('http://127.0.0.1:52738/4aac8096ea91216c4af365089260ae5e2bbf36de8ff6ef014837a23b7a7fbb83');
       if(runtime.code!==200) throw new Error('Private local fixture unavailable');
       const values=runtime.json();
       if(values.qa_api_url!=='http://127.0.0.1:54321'||values.qa_batch_id!=='2155e99e-bda4-4c68-95cf-b74cacd84ecd') throw new Error('Local batch mismatch');
       for(const [key,value] of Object.entries(values)) pm.variables.set(key,value);
       pm.variables.set('qa_runtime_v5_loaded',true);
      }
      const base=pm.variables.get('qa_api_url');
      if(base!=='http://127.0.0.1:54321') throw new Error('Solo API local autorizada');
      const key=pm.variables.get('qa_public_key');
      if(!key) throw new Error('Falta clave pública local; nunca service_role');
      if(key.startsWith('eyJ')) { let claims; try { claims=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); } catch { throw new Error('Clave pública inválida'); } if(claims.role!=='anon') throw new Error('Solo clave anon, nunca rol privilegiado'); } else if(!key.startsWith('sb_publishable_')) throw new Error('Solo clave pública publishable');
    language: text/javascript
