$kind: http-request
url: "{{qa_api_url}}/auth/v1/logout?scope=local"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token}}
  Content-Type: application/json
queryParams:
  scope: local
scripts:
  - type: beforeRequest
    code: |-
      const token=pm.variables.get('qa_token_familia');
      if(!token) throw new Error('Iniciar sesión sintética familia primero');
      pm.variables.set('qa_token',token);
      pm.variables.set('qa_actor_id',pm.variables.get('qa_actor_familia'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Sesión revocada',()=>pm.expect(pm.response.code).to.eql(204));
      pm.variables.unset('qa_token_familia');
      pm.variables.unset('qa_actor_familia');
      pm.variables.unset('qa_token');
      pm.variables.unset('qa_actor_id');
    language: text/javascript
order: 9000
