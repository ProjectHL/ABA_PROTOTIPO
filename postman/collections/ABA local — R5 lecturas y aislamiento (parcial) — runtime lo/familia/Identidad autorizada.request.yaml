$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_identity_context"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_organization_id": null
    }
scripts:
  - type: beforeRequest
    code: |-
      const token=pm.variables.get('qa_token_familia');
      if(!token) throw new Error('Iniciar sesión sintética familia primero');
      pm.variables.set('qa_token',token);
      pm.variables.set('qa_actor_id',pm.variables.get('qa_actor_familia'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      const data=pm.response.json();
      pm.test('Usuario correlacionado',()=>pm.expect(data.userId).to.eql(pm.variables.get('qa_actor_id')));
      pm.test('Sin clínica general',()=>{pm.expect(data.active).to.eql(null);pm.expect(data.choices).to.eql([]);});
    language: text/javascript
order: 2000
