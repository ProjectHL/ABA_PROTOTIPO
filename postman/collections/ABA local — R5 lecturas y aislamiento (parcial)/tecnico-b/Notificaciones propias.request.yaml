$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_notifications_read_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_limit": 50
    }
scripts:
  - type: beforeRequest
    code: |-
      const token=pm.variables.get('qa_token_tecnico_b');
      if(!token) throw new Error('Iniciar sesión sintética tecnico-b primero');
      pm.variables.set('qa_token',token);
      pm.variables.set('qa_actor_id',pm.variables.get('qa_actor_tecnico_b'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      const data=pm.response.json();
      pm.test('Actor correlacionado',()=>pm.expect(data.actorId).to.eql(pm.variables.get('qa_actor_id')));
    language: text/javascript
order: 3000
