$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_calendar_read_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_b}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_organization_id": "{{qa_clinic_a}}"
    }
scripts:
  - type: beforeRequest
    code: if(!pm.variables.get('qa_token_admin_b')) throw new Error('Iniciar sesión del actor sintético primero');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 403',()=>pm.response.to.have.status(403)); if(pm.response.code!==403) throw new Error('HTTP inesperado; cuerpo omitido');
      pm.test('SQL autorización',()=>pm.expect(pm.response.json().code).to.eql('42501'));
    language: text/javascript
order: 17000
