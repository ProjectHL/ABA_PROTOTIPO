$kind: collection
name: ABA local — R5 HTTP complementario V5 (agenda, Storage, Edge) — runtime local V5
description: "Postman 2.1 sin secretos. Ejecutar serial sólo con lote ready 2155e99e-bda4-4c68-95cf-b74cacd84ecd y variables privadas locales sin sync/export. Una cita mínima QA R5 POSTMAN V5 se crea, edita, reenvía exactamente, comprueba conflicto y se cancela conservando registro; nunca se borran citas/objetos. Cada ejecución genera una cita nueva propia; si se interrumpe preservar ID/comandos runtime y consultar antes de reanudar. Logout local final de ambos actores; si interrupción ejecutar logout por separado. Tokens y metadata efímeros únicamente pm.variables. Complementa READS/UI; no acredita QA completo. GAPS: Edge verify-attachment-upload no expone lectura y sólo admite confirmación de una reserva pending-upload; aquí se acreditan OPTIONS/contrato/Auth/origin negativos sin reserva/upload/confirm. Éxito/verificación bytes corresponde a suite documentos existente. Sin cookies web no se duplica Server Actions ni /attachments/read: Storage GET autenticado, RPC metadata y URLs firmadas denegadas son interfaces HTTP reales. PNG existing available qa-r5-* del lote debe existir; ausencia bloquea evidencia Storage sin crear datos. Realtime/correo/PWA/UI/restore permanecen fuera de esta colección. Variables privadas: qa_public_key, qa_clinic_a/b, qa_admin_a/b_email/password; opcional qa_http_gate=1 sólo local. No usar service_role."
variables:
  qa_api_url: http://127.0.0.1:54321
  qa_batch_id: 2155e99e-bda4-4c68-95cf-b74cacd84ecd
  qa_http_gate: ""
  qa_public_key: ""
  qa_clinic_a: ""
  qa_clinic_b: ""
scripts:
  - type: http:beforeRequest
    code: |-
      if(pm.variables.get('qa_api_url')!=='http://127.0.0.1:54321') throw new Error('Local API required');
      if(!pm.variables.get('qa_runtime_v5_loaded')) {
       const runtime=await pm.sendRequest('http://127.0.0.1:56298/c7582e01e261f4ec274c442c44c7a380cfb9d1cf4b69f5ca495457481dc90287');
       if(runtime.code!==200) throw new Error('Private local fixture unavailable');
       const values=runtime.json();
       if(values.qa_api_url!=='http://127.0.0.1:54321'||values.qa_batch_id!=='2155e99e-bda4-4c68-95cf-b74cacd84ecd') throw new Error('Local batch mismatch');
       for(const [key,value] of Object.entries(values)) pm.variables.set(key,value);
       pm.variables.set('qa_runtime_v5_loaded',true);
      }
      if(pm.variables.get('qa_api_url')!=='http://127.0.0.1:54321'||pm.variables.get('qa_batch_id')!=='2155e99e-bda4-4c68-95cf-b74cacd84ecd') throw new Error('Solo API loopback y lote exacto autorizados');
      if(pm.variables.get('qa_http_gate')!=='1') throw new Error('Gate HTTP local opt-in requerido');
      const key=pm.variables.get('qa_public_key');if(!key) throw new Error('Clave pública local privada requerida');
      if(key.startsWith('eyJ')){let c;try{c=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch{throw new Error('Clave pública inválida');}if(c.role!=='anon') throw new Error('Nunca rol privilegiado');}else if(!key.startsWith('sb_publishable_')) throw new Error('Solo clave pública publishable');
      for(const name of ['qa_clinic_a','qa_clinic_b']) if(!/^[0-9a-f-]{36}$/i.test(pm.variables.get(name)||'')) throw new Error('Clínicas privadas del lote requeridas');if(pm.variables.get('qa_clinic_a')===pm.variables.get('qa_clinic_b')) throw new Error('Clínicas distintas requeridas');
    language: text/javascript
