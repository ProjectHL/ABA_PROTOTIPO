$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_student_detail_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_a}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_organization_id": "{{qa_clinic_a}}",
      "p_client_id": "b347646e-ff29-450b-aedf-9f9c015fb41a"
    }
scripts:
  - type: beforeRequest
    code: if(!pm.variables.get('qa_token_admin_a')) throw new Error('Iniciar sesión del actor sintético primero');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200)); if(pm.response.code!==200) throw new Error('HTTP inesperado; cuerpo omitido');
      const d=pm.response.json(); if(d?.id!=='b347646e-ff29-450b-aedf-9f9c015fb41a'||d.clinicalId!=='QA-R5-A-2155E99E'||d.fullName!=='QA SINTETICO LOCAL A'||d.clinicId!==pm.variables.get('qa_clinic_a')||!d.capabilities.includes('student.edit')) throw new Error('Ficha sintética/capacidad no verificada'); pm.test('Ficha y permiso actuales',()=>pm.expect(d.id).to.eql('b347646e-ff29-450b-aedf-9f9c015fb41a')); pm.variables.set('qa_http_student_ready',true);
    language: text/javascript
order: 5000
