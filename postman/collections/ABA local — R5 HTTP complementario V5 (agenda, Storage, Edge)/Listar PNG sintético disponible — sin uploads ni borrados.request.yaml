$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_attachment_list_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_a}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_organization_id": "{{qa_clinic_a}}",
      "p_resource": {
        "kind": "student",
        "clinicId": "{{qa_clinic_a}}",
        "studentId": "b347646e-ff29-450b-aedf-9f9c015fb41a"
      },
      "p_include_archived": false
    }
scripts:
  - type: beforeRequest
    code: if(!pm.variables.get('qa_token_admin_a')) throw new Error('Iniciar sesión del actor sintético primero');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200)); if(pm.response.code!==200) throw new Error('HTTP inesperado; cuerpo omitido');
      const rows=pm.response.json();const candidates=rows.filter(v=>v.state==='available'&&v.upload?.mimeType==='image/png'&&/^qa-r5-/i.test(v.upload.fileName)&&v.testBatchId===pm.variables.get('qa_batch_id')&&v.resource.kind==='student'&&v.resource.studentId==='b347646e-ff29-450b-aedf-9f9c015fb41a');if(!candidates.length) throw new Error('Gap: PNG sintético available no encontrado; no crear ni subir uno');candidates.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const v=candidates[0];if(v.bucket!=='clinical-attachments'||v.resource.clinicId!==pm.variables.get('qa_clinic_a')) throw new Error('Recurso PNG no verificado');pm.variables.set('qa_png_version',v.id);pm.variables.set('qa_png_metadata',JSON.stringify(v));pm.variables.set('qa_png_path',v.objectKey.split('/').map(encodeURIComponent).join('/'));pm.test('PNG existente del lote verificado',()=>pm.expect(v.state).to.eql('available'));
    language: text/javascript
order: 22000
