$kind: http-request
url: "{{qa_api_url}}/functions/v1/verify-attachment-upload"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_b}}
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: beforeRequest
    code: |-
      if(!pm.variables.get('qa_token_admin_b')) throw new Error('Iniciar sesión del actor sintético primero');
      pm.request.headers.upsert({key:'Origin',value:'https://qa-disallowed.example.test'});
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 403',()=>pm.response.to.have.status(403)); if(pm.response.code!==403) throw new Error('HTTP inesperado; cuerpo omitido');
      pm.test('Origen denegado',()=>pm.expect(pm.response.json().error).to.eql('origin_not_allowed'));
    language: text/javascript
order: 33000
