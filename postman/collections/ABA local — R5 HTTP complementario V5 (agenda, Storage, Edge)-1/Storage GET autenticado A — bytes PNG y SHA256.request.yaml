$kind: http-request
url: "{{qa_api_url}}/storage/v1/object/authenticated/clinical-attachments/{{qa_png_path}}"
method: GET
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_a}}
  Content-Type: application/json
scripts:
  - type: beforeRequest
    code: |-
      if(pm.variables.get('qa_png_version')!=='17834b36-a2d1-4821-aa7e-51ef251fcb04'||!pm.variables.get('qa_png_path')||!pm.variables.get('qa_png_metadata')) throw new Error('Recurso PNG exacto no confirmado; no ejecutar negativo con marcador vacío');
      if(!pm.variables.get('qa_token_admin_a')) throw new Error('Iniciar sesión del actor sintético primero');
      if(!pm.variables.get('qa_png_metadata')) throw new Error('PNG autorizado no confirmado');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200)); if(pm.response.code!==200) throw new Error('HTTP inesperado; cuerpo omitido');
      const v=JSON.parse(pm.variables.get('qa_png_metadata')),bytes=pm.response.stream;if(!bytes) throw new Error('Runtime sin bytes de respuesta; PNG no acreditado');const hex=Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');const CryptoJS=require('crypto-js');const hash=CryptoJS.SHA256(CryptoJS.enc.Hex.parse(hex)).toString();pm.test('PNG exacto publicado: firma/tamaño/SHA256',()=>{pm.expect(hex.slice(0,16)).to.eql('89504e470d0a1a0a');pm.expect(bytes.length).to.eql(v.upload.byteLength);pm.expect(hash).to.eql(v.upload.sha256);pm.expect(pm.response.headers.get('Content-Type')).to.include('image/png');});
    language: text/javascript
order: 24000
