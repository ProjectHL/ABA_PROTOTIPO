$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_attachment_read_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_b}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_organization_id": "{{qa_clinic_a}}",
      "p_resource": {
        "kind": "student",
        "clinicId": "{{qa_clinic_a}}",
        "studentId": "b347646e-ff29-450b-aedf-9f9c015fb41a"
      },
      "p_version_id": "{{qa_png_version}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      if(pm.variables.get('qa_png_version')!=='17834b36-a2d1-4821-aa7e-51ef251fcb04'||!pm.variables.get('qa_png_path')||!pm.variables.get('qa_png_metadata')) throw new Error('Recurso PNG exacto no confirmado; no ejecutar negativo con marcador vacío');
      if(!pm.variables.get('qa_token_admin_b')) throw new Error('Iniciar sesión del actor sintético primero');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 403',()=>pm.response.to.have.status(403)); if(pm.response.code!==403) throw new Error('HTTP inesperado; cuerpo omitido');
      pm.test('Metadata protegida',()=>pm.expect(pm.response.json().code).to.eql('42501'));
    language: text/javascript
order: 25000
