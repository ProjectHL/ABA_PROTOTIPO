$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_calendar_command_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_a}}
  Content-Type: application/json
body:
  type: json
  content: "{{qa_http_body}}"
scripts:
  - type: beforeRequest
    code: |-
      if(!pm.variables.get('qa_token_admin_a')) throw new Error('Iniciar sesión del actor sintético primero');
      if(pm.variables.get('qa_http_phase')!=='replay-read') throw new Error('Fase previa no confirmada; no enviar comando');const c=JSON.parse(pm.variables.get('qa_http_stale'));if(c.appointmentId!==pm.variables.get('qa_http_id')||c.studentId!=='b347646e-ff29-450b-aedf-9f9c015fb41a'||('input' in c&&c.input.title!==pm.variables.get('qa_http_title'))) throw new Error('Comando no pertenece a la cita propia');pm.variables.set('qa_http_body',JSON.stringify({p_organization_id:pm.variables.get('qa_clinic_a'),p_command:c}));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200)); if(pm.response.code!==200) throw new Error('HTTP inesperado; cuerpo omitido');
      const d=pm.response.json(),c=JSON.parse(pm.variables.get('qa_http_stale'));pm.test('Conflicto correlacionado conserva versión 2',()=>{pm.expect(d.status).to.eql('conflict');pm.expect(d.code).to.eql('version-conflict');pm.expect(d.expectedVersion).to.eql(1);pm.expect(d.currentVersion).to.eql(2);pm.expect(d.operationId).to.eql(c.operationId);pm.expect(d.idempotencyKey).to.eql(c.idempotencyKey);pm.expect(d.resourceId).to.eql(c.appointmentId);});if(d.status!=='conflict'||d.code!=='version-conflict'||d.currentVersion!==2) throw new Error('Conflicto no confirmado');pm.variables.set('qa_http_phase','stale');
    language: text/javascript
order: 13000
