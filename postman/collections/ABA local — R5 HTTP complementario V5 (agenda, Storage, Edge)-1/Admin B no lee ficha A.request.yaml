$kind: http-request
url: "{{qa_api_url}}/rest/v1/rpc/aba_student_detail_v2"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Authorization: Bearer {{qa_token_admin_b}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "p_organization_id": "{{qa_clinic_a}}",
      "p_client_id": "b347646e-ff29-450b-aedf-9f9c015fb41a"
    }
scripts:
  - type: beforeRequest
    code: if(!pm.variables.get('qa_token_admin_b')) throw new Error('Iniciar sesión del actor sintético primero');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200)); if(pm.response.code!==200) throw new Error('HTTP inesperado; cuerpo omitido');
      pm.test('Sin ficha ni snapshot',()=>pm.expect(pm.response.json()).to.eql(null));
    language: text/javascript
order: 18000
