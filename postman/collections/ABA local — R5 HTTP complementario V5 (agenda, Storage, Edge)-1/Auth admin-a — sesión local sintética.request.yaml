$kind: http-request
url: "{{qa_api_url}}/auth/v1/token?grant_type=password"
method: POST
headers:
  apikey: "{{qa_public_key}}"
  Content-Type: application/json
queryParams:
  grant_type: password
body:
  type: json
  content: |-
    {
      "email": "{{qa_admin_a_email}}",
      "password": "{{qa_admin_a_password}}"
    }
scripts:
  - type: beforeRequest
    code: if(pm.variables.get('qa_admin_a_email')!=='admin-a.'+pm.variables.get('qa_batch_id')+'@aba.example.test'||!pm.variables.get('qa_admin_a_password')) throw new Error('Credenciales sintéticas privadas requeridas');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200)); if(pm.response.code!==200) throw new Error('HTTP inesperado; cuerpo omitido');
      const d=pm.response.json(); if(d.user?.app_metadata?.aba_fixture_batch!==pm.variables.get('qa_batch_id')||d.user.email!=='admin-a.'+pm.variables.get('qa_batch_id')+'@aba.example.test'||!d.access_token) throw new Error('Actor sintético no confirmado; valores omitidos');
      pm.test('Actor del lote ready',()=>pm.expect(d.user.app_metadata.aba_fixture_batch).to.eql(pm.variables.get('qa_batch_id')));
      pm.variables.set('qa_token_admin_a',d.access_token); pm.variables.set('qa_actor_admin_a',d.user.id);
    language: text/javascript
order: 1000
