# Dokploy-ready stack: Next.js standalone + PostgreSQL 17 + private volume.
#
# Dokploy terminates TLS and routes the public domain to `app:3000`, so this
# file publishes no host ports. For a local run use docker-compose.local.yml.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Hard RAM ceiling. 256 MB is enough for this data volume only with the
    # tuned settings below; raise it if pg_stat_activity shows memory pressure.
    mem_limit: ${DB_MEMORY_LIMIT:-256m}
    # /dev/shm is a tmpfs charged to the container memory limit, so keep it small.
    shm_size: 64mb
    # Defaults assume 128 MB shared_buffers and 100 connections, which alone
    # exceed the container limit. These values fit comfortably in 256 MB.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=64MB
      - -c
      - temp_file_limit=1GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aba}
    volumes:
      # Set DB_DATA_DIR to a loopback ext4 mount to enforce the disk quota
      # (see db-disk-quota.sh). Without it the named volume has no size cap.
      - ${DB_DATA_DIR:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  # Applies db/bootstrap.sql and every pending db/migrations/*.sql exactly once.
  # Runs to completion before the app starts; a failed migration stops the stack.
  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aba}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aba}
    volumes:
      - ../db:/db:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  app:
    image: aba-clinico:${ABA_IMAGE_TAG:-latest}
    build:
      context: ..
      secrets:
        - next_server_actions_encryption_key
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aba}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aba}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to at least 32 random bytes}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set the public application origin}
      SMTP_HOST: ${SMTP_HOST:-email.shiftium.xyz}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-email.shiftium.xyz}
      SMTP_USER: ${SMTP_USER:-no-reply@email.shiftium.xyz}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ABA Clínico <no-reply@email.shiftium.xyz>}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      STORAGE_ROOT: /data/storage
      ABA_TEST_RUN_ID: ${ABA_TEST_RUN_ID:-}
    volumes:
      - storage_data:/data/storage
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  storage_data:

secrets:
  next_server_actions_encryption_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
